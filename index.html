<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Happy Birthday, Nikhil</title>
  <style>
    :root{--pw:300px;--ph:400px;--u:3px;--red:#8a1a2e;--hand:"Segoe Script","Bradley Hand","Snell Roundhand","Brush Script MT",cursive}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;overflow:hidden}
    body{background:#1a1412;background-image:url(Background.jpg);background-size:cover;background-position:center}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,#0000 35%,#0005 100%)}
    .book{z-index:1;position:absolute;width:var(--pw);height:var(--ph);left:calc(50vw - var(--pw)/2);top:calc((100vh - var(--ph))/2 - 1.5vh);perspective:2400px;transition:transform 1.2s cubic-bezier(.6,.05,.25,1)}
    .book.open{transform:translateX(calc(var(--pw)/2))}
    .pg{position:absolute;inset:0;background:#ece9e2}
    .rp{z-index:1;isolation:isolate}.rp::before,.lp::after{content:"";position:absolute;top:0;bottom:0;width:12%;pointer-events:none;z-index:9}
    .rp::before{left:0;background:linear-gradient(90deg,#0004,#0000)}.lp::after{right:0;background:linear-gradient(270deg,#0004,#0000)}
    .cw{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.6,.05,.25,1);z-index:3}
    .book.open .cw{transform:rotateY(-180deg)}
    .cf{position:absolute;inset:0;backface-visibility:hidden;cursor:pointer;outline-offset:6px}
    .cf img{position:absolute;width:100%;height:100%;object-fit:cover;filter:drop-shadow(0 8px 14px #0006);pointer-events:none}
    .book.open .cf{pointer-events:none}
    .lp{transform:rotateY(180deg);backface-visibility:hidden}
    .hint{position:absolute;top:calc(100% + 16px);width:100%;text-align:center;font:italic 15px var(--hand);color:#fff;text-shadow:0 1px 6px #000c;transition:opacity .4s}
    .book.open .hint{opacity:0}
    .content{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
    .content img{max-width:90%;height:auto;border-radius:8px;box-shadow:0 4px 6px #0003}
    .ctl{text-shadow:0 0 5px #ece9e2,0 0 3px #ece9e2,0 0 8px #ece9e2;position:absolute;left:calc(var(--u)*8);right:calc(var(--u)*8);bottom:calc(var(--u)*4);text-align:center;font-size:max(11px,calc(var(--u)*3.6));font-family:var(--hand);color:#5a3a26}
    .st{min-height:2.6em;margin:0 0 calc(var(--u)*1.5);color:#5a3a26;line-height:1.3}
    .meter{height:calc(var(--u)*2.6);min-height:8px;border-radius:9px;background:#ece9e2dd;border:1px solid #3b241755;overflow:hidden;position:relative;margin-bottom:calc(var(--u)*2.5)}
    .meter b{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#e8a33a,#c0392b)}
    .meter s{position:absolute;top:0;bottom:0;left:45%;width:2px;background:#3b2417}
    .row{display:flex;gap:calc(var(--u)*2.5);justify-content:center;flex-wrap:wrap}
    button.b{font:inherit;color:#fff;background:var(--red);border:0;border-radius:99px;padding:.6em 1.2em;cursor:pointer;box-shadow:0 3px 0 #4d0c19;touch-action:none;user-select:none}
    button.b:active,button.b.on{transform:translateY(2px);box-shadow:0 1px 0 #4d0c19}
    button.b.alt{background:#f3ead6;color:var(--red);box-shadow:0 3px 0 #b9a77e}
    .wish{display:none}.done .wish{display:block}.done .live{display:none}
    .wish h2{margin:0 0 .3em;font:normal max(22px,calc(var(--u)*8)) var(--hand);color:var(--red)}
    .wish p{margin:0 0 .9em;font:italic max(12px,calc(var(--u)*3.6)) var(--hand)}
    .back{position:fixed;left:50%;bottom:3vh;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.5s .6s;z-index:20}
    .book.open~.back{opacity:1;transform:translate(-50%,0);pointer-events:auto}
    #cf{position:fixed;inset:0;pointer-events:none;z-index:30}
    @media(prefers-reduced-motion:reduce){.book,.cw{transition-duration:.01s}}
  </style>
</head>
<body>
<main class="book" id="book">
  <section class="pg rp" id="rp">
    <div class="content">
      <img src="Main card.jpg" alt="Birthday cake with candle" style="max-width:80%">
    </div>
    <div class="ctl" id="ctl">
      <div class="live">
        <p class="st" id="st">🎂 Blow out the candle!</p>
        <div class="meter" aria-label="Microphone level"><b id="mb"></b><s></s></div>
        <div class="row">
          <button class="b alt" id="mic">Use microphone</button>
          <button class="b" id="hold">Hold to blow</button>
        </div>
      </div>
      <div class="wish">
        <h2>make a wish</h2>
        <p>Happy birthday, Nikhil.</p>
        <button class="b" id="relight">Relight</button>
      </div>
    </div>
  </section>
  
  <div class="cw">
    <div class="cf" id="cover" role="button" tabindex="0" aria-label="Open the card">
      <img alt="Happy Birthday Card Front" src="Card front.jpg">
    </div>
    <section class="pg lp">
      <div class="content">
        <img src="Letter.jpg" alt="A special letter for Nikhil" style="max-width:85%">
        <button class="b" id="back" style="margin-top:1.5em">Back to card</button>
      </div>
    </section>
  </div>
</main>

<button class="b back" id="relight-btn" style="position:fixed;left:50%;bottom:3vh;transform:translate(-50%);display:none;z-index:20">Relight candle</button>

<script>
const book=document.getElementById("book"),cover=document.getElementById("cover"),mic=document.getElementById("mic"),hold=document.getElementById("hold"),back=document.getElementById("back"),st=document.getElementById("st"),mb=document.getElementById("mb"),ctl=document.getElementById("ctl"),relightBtn=document.getElementById("relight-btn");

let isOpen=false,micActive=false;

cover.addEventListener("click",()=>{
  isOpen=!isOpen;
  book.classList.toggle("open");
  if(isOpen) {
    mic.focus();
    st.textContent="🎂 Blow out the candle!";
  }
});

hold.addEventListener("mousedown",blowOut);
hold.addEventListener("touchstart",blowOut);

mic.addEventListener("click",()=>{
  micActive=!micActive;
  mic.textContent=micActive?"Stop microphone":"Use microphone";
  micActive?startMic():stopMic();
});

back&&back.addEventListener("click",()=>{
  book.classList.remove("open");
  isOpen=false;
});

function blowOut(){
  st.textContent="🎉 Make a wish!";
  ctl.classList.add("done");
  relightBtn.style.display="block";
}

document.getElementById("relight").addEventListener("click",relightCandle);
relightBtn.addEventListener("click",relightCandle);

function relightCandle(){
  st.textContent="🎂 Blow out the candle!";
  ctl.classList.remove("done");
  relightBtn.style.display="none";
  stopMic();
}

function startMic(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const audioContext=new(window.AudioContext||window.webkitAudioContext);
    const analyser=audioContext.createAnalyser();
    const source=audioContext.createMediaStreamSource(stream);
    source.connect(analyser);
    analyser.fftSize=256;
    const dataArray=new Uint8Array(analyser.frequencyBinCount);
    
    const checkBlow=setInterval(()=>{
      analyser.getByteFrequencyData(dataArray);
      const average=dataArray.reduce((a,b)=>a+b)/dataArray.length;
      mb.style.width=Math.min(100,average/2.55)+"%";
      if(average>100){
        clearInterval(checkBlow);
        blowOut();
        stopMic();
      }
    },50);
  }).catch(()=>{
    st.textContent="🎤 Microphone access denied";
  });
}

function stopMic(){
  micActive=false;
  mic.textContent="Use microphone";
}
</script>
</body>
</html>
