<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happy Birthday, Nikhil</title>
  <style>
    :root {
      --bg-dark: rgba(0, 0, 0, 0.38);
      --paper: #f0efe9;
      --paper-shadow: rgba(0, 0, 0, 0.12);
      --deep-red: #8d0d2d;
      --red: #a61132;
      --rose: #d34a6a;
      --ink: #4a2c26;
      --gold: #d7b54d;
      --cream: #f9f3ed;
      --black: #1c120f;
      --card-w: min(84vw, 420px);
      --card-h: calc(var(--card-w) * 1.45);
      --spread-w: min(78vw, 620px);
      --spread-h: min(72vh, 580px);
      --page-h: calc(var(--spread-h) * 0.95);
      --page-w: calc(var(--spread-w) / 2.3);
      --page-pad: 18px;
      --hand: "Segoe Script", "Bradley Hand", "Snell Roundhand", "Brush Script MT", cursive;
      --serif: Georgia, serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--hand);
      background: #201817;
    }

    body {
      background-image: url('Background.jpg');
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.4) 66%, rgba(0,0,0,0.54) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .scene {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2000px;
    }

    .book {
      position: relative;
      width: var(--card-w);
      height: var(--card-h);
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(.6,.05,.25,1);
      filter: drop-shadow(0 16px 24px rgba(0,0,0,.22));
    }

    .book.open {
      transform: translateX(0) rotateY(0deg);
    }

    .cover {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: rgba(250,248,244,0.35);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      user-select: none;
      transition: opacity 0.5s ease;
      padding: 0;
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: 6px;
      pointer-events: none;
    }

    .cover img {
      width: 96%;
      height: 96%;
      object-fit: contain;
      border-radius: 2px;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.12));
      position: relative;
      z-index: 1;
    }

    .cover-hint {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      font-style: italic;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
      letter-spacing: 0.02em;
      z-index: 2;
    }

    .spread {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: var(--spread-w);
      height: var(--spread-h);
      display: flex;
      align-items: stretch;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      filter: drop-shadow(0 18px 32px rgba(0,0,0,0.25));
    }

    .book.open ~ .spread,
    .book.open .spread {
      opacity: 1;
      pointer-events: auto;
    }

    .page {
      position: relative;
      width: calc(var(--spread-w) / 2.1);
      height: var(--spread-h);
      background: rgba(239,236,229,0.78);
      background-image:
        radial-gradient(circle at 1px 1px, rgba(0,0,0,0.08) 1px, transparent 0);
      background-size: 8px 8px;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), 0 4px 10px rgba(0,0,0,0.08);
      padding: 22px 18px 12px;
      overflow: hidden;
    }

    .page.left {
      border-right: 1px solid rgba(0,0,0,0.06);
      background-position: center;
    }

    .page.right {
      border-left: 1px solid rgba(0,0,0,0.06);
    }

    .page-title {
      display: block;
      width: 100%;
      max-width: 230px;
      margin: 0 auto 12px;
      text-align: center;
      font-size: clamp(1.2rem, 2vw, 2.3rem);
      line-height: 1;
      color: var(--deep-red);
      font-style: italic;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-shadow: 0 1px 0 rgba(0,0,0,0.12);
    }

    .page-title.right {
      max-width: 240px;
      font-size: clamp(1.5rem, 2.2vw, 2.8rem);
    }

    .letter-wrap {
      position: relative;
      width: min(85%, 260px);
      height: 190px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #7f081b, #a30b27 42%, #8d0d2d 100%);
      border-radius: 2px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
      z-index: 1;
    }

    .letter-sheet {
      position: absolute;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%);
      width: 82%;
      height: 78%;
      background: rgba(255,255,255,0.78);
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 8px 10px rgba(0,0,0,0.07);
      z-index: 2;
      cursor: pointer;
      transition: all 0.8s cubic-bezier(.5,0,.2,1);
    }

    .letter-sheet img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .letter-sheet.pulled {
      width: 210px;
      height: 230px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1.25);
      z-index: 30;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .letter-hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-style: italic;
      color: rgba(70,40,33,0.8);
      text-align: center;
      white-space: nowrap;
    }

    .candle-wrap {
      position: relative;
      width: 230px;
      height: 200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .cake {
      width: 160px;
      height: 130px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.05));
      position: relative;
      z-index: 1;
    }

    .flame {
      position: absolute;
      left: 50%;
      top: 24px;
      width: 42px;
      height: 70px;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 12px rgba(255,180,50,0.8)) drop-shadow(0 0 24px rgba(255,144,50,0.45));
      transition: transform .08s linear, opacity .2s ease, filter .2s ease;
      z-index: 2;
      animation: flicker 0.28s ease-in-out infinite alternate;
    }

    .flame::before, .flame::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(252,254,157,0.95), rgba(255,141,0,0.9) 50%, rgba(255,80,0,0.9));
      clip-path: polygon(50% 0%, 100% 55%, 88% 100%, 50% 88%, 12% 100%, 0% 55%);
      border-radius: 50% 50% 46% 46%;
      transform-origin: center bottom;
    }

    .flame::after {
      transform: scale(0.72) rotate(12deg);
      opacity: 0.72;
    }

    .flame.out {
      opacity: 0;
      filter: blur(5px);
      animation: none;
      transform: translateX(-50%) scale(0.2);
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) rotate(-2deg) scaleY(1); }
      50% { transform: translateX(-50%) rotate(3deg) scaleY(1.08); }
      100% { transform: translateX(-50%) rotate(-4deg) scaleY(0.96); }
    }

    .controls {
      width: 100%;
      margin-top: 14px;
      text-align: center;
    }

    .live {
      display: block;
    }

    .status {
      min-height: 22px;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--ink);
      font-style: italic;
    }

    .meter {
      position: relative;
      width: min(72%, 180px);
      height: 11px;
      margin: 0 auto 16px;
      border-radius: 999px;
      background: rgba(12,9,9,0.08);
      border: 1px solid rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .meter-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, #efb24d, #c32639);
      border-radius: inherit;
      transition: width .08s linear;
    }

    .meter-mark {
      position: absolute;
      left: 45%;
      top: 0;
      width: 2px;
      height: 100%;
      background: rgba(76,57,49,0.55);
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 0 auto;
    }

    button {
      border: none;
      border-radius: 999px;
      background: var(--deep-red);
      color: #fff;
      font: inherit;
      font-size: 15px;
      padding: 10px 20px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(86, 6, 20, 0.7);
      transition: transform .1s ease, box-shadow .1s ease;
      touch-action: none;
      user-select: none;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(86, 6, 20, 0.7);
    }

    button.alt {
      background: #f5ead9;
      color: var(--deep-red);
      box-shadow: 0 3px 0 rgba(136,120,85,0.7);
    }

    .wish-state {
      display: none;
      padding-top: 10px;
      text-align: center;
    }

    .wish-state h2 {
      margin: 8px 0 8px;
      font-size: clamp(1.2rem, 2vw, 2.4rem);
      color: var(--deep-red);
      font-style: italic;
      font-weight: 600;
    }

    .wish-state p {
      margin: 4px 0 16px;
      font-size: 1rem;
      color: var(--ink);
      font-style: italic;
    }

    .book.wish-made .live { display: none; }
    .book.wish-made .wish-state { display: block; }

    .back-button {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 12;
    }

    .book.open ~ .back-button {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    #confetti {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      pointer-events: none;
    }

    .book.wish-made ~ #confetti {
      display: block;
    }

    @media (max-width: 760px) {
      :root {
        --spread-w: min(88vw, 560px);
        --spread-h: min(68vh, 440px);
      }
      .page-title {
        max-width: 170px;
      }
      .page-title.right {
        max-width: 190px;
      }
      .letter-wrap {
        width: 70%;
      }
      .candle-wrap {
        width: 170px;
      }
      .cake {
        width: 140px;
      }
      .button-row { gap: 8px; }
      button { padding: 9px 14px; font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="book" id="book">
      <div class="cover" id="cover" tabindex="0" role="button" aria-label="Open the birthday card">
        <img src="Card front.jpg" alt="Happy Birthday Baby" />
        <div class="cover-hint">tap to open</div>
      </div>
    </div>

    <div class="spread">
      <div class="page left">
        <div class="page-title">A letter<br>for you <span style="font-size:0.7em; font-weight:600;">(AS ALWAYS)</span></div>
        <div class="letter-wrap">
          <div class="envelope-back"></div>
          <div class="letter-sheet" id="letter">
            <img src="Letter.jpg" alt="Letter to Nikhil" />
          </div>
          <svg class="envelope-front" viewBox="0 0 200 200" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,0 L100,70 L200,0 L200,200 L0,200 Z" fill="rgba(255,255,255,0.06)" />
            <path d="M0,0 L100,65 L200,0" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
            <path d="M0,0 L0,200 L200,200 L200,0" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
          </svg>
        </div>
        <div class="letter-hint">tap the letter</div>
      </div>

      <div class="page right">
        <div class="page-title right">Blow The Candle</div>

        <div class="candle-wrap">
          <img src="Main card.jpg" alt="Birthday cake" class="cake" />
          <div class="flame" id="flame" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <div class="live">
            <div class="status" id="status">🎂 Blow out the candle!</div>
            <div class="meter" aria-label="Microphone level">
              <div class="meter-fill" id="meterFill"></div>
              <div class="meter-mark"></div>
            </div>
            <div class="button-row">
              <button class="alt" id="micBtn" type="button">Use microphone</button>
              <button id="holdBtn" type="button">Hold to blow</button>
            </div>
          </div>

          <div class="wish-state">
            <h2>make a wish</h2>
            <p>Happy birthday, Nikhil.</p>
            <button id="relightBtn" type="button">Relight</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="back-button" id="backBtn" type="button">Back to cover</button>
  <canvas id="confetti"></canvas>

  <script>
    const book = document.getElementById('book');
    const cover = document.getElementById('cover');
    const letter = document.getElementById('letter');
    const flame = document.getElementById('flame');
    const backBtn = document.getElementById('backBtn');
    const status = document.getElementById('status');
    const meterFill = document.getElementById('meterFill');
    const micBtn = document.getElementById('micBtn');
    const holdBtn = document.getElementById('holdBtn');
    const relightBtn = document.getElementById('relightBtn');
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');

    let wishMade = false;
    let micActive = false;
    let audioStream = null;
    let blowState = false;
    let startOfBlow = 0;
    let confetti = [];

    function openCard() {
      book.classList.add('open');
      book.classList.remove('wish-made');
      status.textContent = '🎂 Blow out the candle!';
      meterFill.style.width = '0%';
      flame.classList.remove('out');
      if (letter.classList.contains('pulled')) letter.classList.remove('pulled');
    }

    function closeCard() {
      book.classList.remove('open');
      book.classList.remove('wish-made');
      flame.classList.remove('out');
      status.textContent = '🎂 Blow out the candle!';
      meterFill.style.width = '0%';
      letter.classList.remove('pulled');
      stopMic();
      clearConfetti();
    }

    cover.addEventListener('click', () => {
      if (!book.classList.contains('open')) openCard();
    });

    cover.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (!book.classList.contains('open')) openCard();
      }
    });

    backBtn.addEventListener('click', closeCard);

    letter.addEventListener('click', () => {
      if (!book.classList.contains('open')) return;
      letter.classList.toggle('pulled');
    });

    function setFlameStrength(strength) {
      const clamp = Math.max(0, Math.min(1, strength));
      const angle = clamp * 42;
      const skew = clamp * 0.6;
      flame.style.transform = `translateX(-50%) rotate(${angle}deg) skewX(${skew}deg)`;
    }

    function resetFlame() {
      flame.style.transform = 'translateX(-50%) rotate(0deg) skewX(0deg)';
    }

    function blowOut() {
      if (wishMade) return;
      wishMade = true;
      book.classList.add('wish-made');
      flame.classList.add('out');
      status.textContent = '';
      meterFill.style.width = '0%';
      launchConfetti();
      stopMic();
    }

    relightBtn.addEventListener('click', () => {
      wishMade = false;
      book.classList.remove('wish-made');
      flame.classList.remove('out');
      resetFlame();
      status.textContent = '🎂 Blow out the candle!';
      clearConfetti();
    });

    holdBtn.addEventListener('mousedown', () => {
      if (!book.classList.contains('open')) return;
      setFlameStrength(1);
      blowOut();
    });

    holdBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!book.classList.contains('open')) return;
      setFlameStrength(1);
      blowOut();
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && book.classList.contains('open') && !wishMade) {
        e.preventDefault();
        setFlameStrength(1);
        blowOut();
      }
    });

    function startMic() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = 'Mic unavailable. Hold the button / Space to blow.';
        return;
      }

      const secure = location.protocol === 'https:' || location.hostname === 'localhost';
      if (!secure) {
        status.textContent = 'Mic needs https. Hold the button / Space to blow.';
        return;
      }

      navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
        }
      }).then((stream) => {
        audioStream = stream;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctxAudio = new AudioCtx();
        const analyser = ctxAudio.createAnalyser();
        analyser.fftSize = 2048;
        const source = ctxAudio.createMediaStreamSource(stream);
        source.connect(analyser);

        const timeData = new Float32Array(analyser.fftSize);
        let noiseFloor = 0.01;
        let smoothed = 0;

        function frame() {
          if (!micActive || wishMade) return;

          analyser.getFloatTimeDomainData(timeData);

          let sum = 0;
          for (let i = 0; i < timeData.length; i++) {
            const v = timeData[i];
            sum += v * v;
          }
          const rms = Math.sqrt(sum / timeData.length);

          noiseFloor = noiseFloor * 0.98 + Math.min(rms, 0.08) * 0.02;
          const level = Math.max(rms - noiseFloor, 0);
          smoothed = smoothed * 0.75 + level * 0.25;

          const pct = Math.min(100, smoothed * 700);
          meterFill.style.width = pct + '%';

          if (smoothed > 0.035) {
            setFlameStrength(Math.min(1, smoothed * 10));
            if (!blowState) {
              blowState = true;
              startOfBlow = performance.now();
            }
            if (performance.now() - startOfBlow > 500) {
              blowOut();
              return;
            }
          } else {
            blowState = false;
            resetFlame();
            meterFill.style.width = '0%';
          }

          requestAnimationFrame(frame);
        }

        frame();
      }).catch(() => {
        status.textContent = 'Mic denied. Hold the button / Space to blow.';
      });
    }

    function stopMic() {
      micActive = false;
      micBtn.textContent = 'Use microphone';
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }
      blowState = false;
      resetFlame();
      meterFill.style.width = '0%';
      status.textContent = '🎂 Blow out the candle!';
    }

    micBtn.addEventListener('click', () => {
      if (!book.classList.contains('open')) return;
      micActive = !micActive;
      micBtn.textContent = micActive ? 'Stop' : 'Use microphone';
      if (micActive) {
        startMic();
      } else {
        stopMic();
      }
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function launchConfetti() {
      const rect = document.querySelector('.candle-wrap').getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const colors = ['#d83f5b', '#f4d7a6', '#f6d5dc', '#d9b04d', '#b31e43'];
      confetti = [];

      for (let i = 0; i < 170; i++) {
        confetti.push({
          x: centerX,
          y: centerY,
          w: 5 + Math.random() * 6,
          h: 13 + Math.random() * 10,
          vx: (Math.random() - 0.5) * 8,
          vy: -4 - Math.random() * 8,
          rot: Math.random() * 360,
          spin: (Math.random() - 0.5) * 16,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: 0.006 + Math.random() * 0.01,
        });
      }

      animateConfetti();
    }

    function animateConfetti() {
      if (!confetti.length) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      confetti = confetti.filter(piece => {
        piece.x += piece.vx;
        piece.y += piece.vy;
        piece.vy += 0.12;
        piece.rot += piece.spin;
        piece.life -= piece.decay;

        if (piece.life <= 0) return false;

        ctx.save();
        ctx.translate(piece.x, piece.y);
        ctx.rotate(piece.rot * Math.PI / 180);
        ctx.fillStyle = piece.color;
        ctx.fillRect(-piece.w / 2, -piece.h / 2, piece.w, piece.h);
        ctx.restore();

        return true;
      });

      requestAnimationFrame(animateConfetti);
    }

    function clearConfetti() {
      confetti = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
